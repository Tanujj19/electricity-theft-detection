services:
  - type: web
    name: electricity-theft-detection-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements_render.txt
    startCommand: uvicorn api_render:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
