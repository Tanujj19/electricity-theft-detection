version: "3.9"

# ==============================================================================
# [RUBRIC 4: DEPLOYMENT & CONTAINERIZATION - 08 MARKS]
# Requirement: Docker & Cloud — Dockerized multi-container stack (API + UI) (4 Marks)
# ==============================================================================

services:
  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: theft-detection-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./config:/app/config:ro
      - ./results:/app/results:ro
    environment:
      - PYTHONPATH=/app
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ── Streamlit Frontend ──────────────────────────────────────────────────────
  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
    container_name: theft-detection-ui
    ports:
      - "8501:8501"
    volumes:
      - ./results:/app/results:ro
    environment:
      - API_URL=http://api:8000/predict
      - PYTHONPATH=/app
    depends_on:
      - api
    restart: unless-stopped

networks:
  default:
    name: theft-detection-network
